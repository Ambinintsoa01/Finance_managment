name: gestion_finances
description: "Application de gestion de finances personnelles multi-comptes (offline-first + synchronisation Supabase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Base de données locale (offline-first) ---
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # --- Synchronisation Cloud ---
  supabase_flutter: ^2.5.9
  connectivity_plus: ^6.0.5

  # --- Graphiques ---
  fl_chart: ^0.68.0

  # --- Utilitaires ---
  uuid: ^4.4.2
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.2
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
